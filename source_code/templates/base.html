{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blood Donation Prediction System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/styles.css' %}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
  <div class="container-fluid">
    <a class="navbar-brand fw-semibold" href="{% url 'dashboard' %}">Donor Prediction</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'donor_list' %}">Donors</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'blood_donors' %}">Blood</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'organ_donors' %}">Organs</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'request_list' %}">Requests</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'reports' %}">Reports</a></li>
      </ul>
      {% if user.is_authenticated %}
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-outline-light btn-sm">Logout</button></form>
      {% endif %}
    </div>
  </div>
</nav>
<main class="container-fluid p-4">
  {% for message in messages %}<div class="alert alert-info">{{ message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
